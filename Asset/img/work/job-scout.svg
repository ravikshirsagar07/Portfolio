<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d11"/>
      <stop offset="50%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="accentG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5d65"/>
      <stop offset="100%" stop-color="#ff8f70"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#1a1c24" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="880" y1="0" x2="880" y2="600"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
  </g>

  <!-- Glowing orb in center-right -->
  <circle cx="700" cy="280" r="140" fill="#ff5d65" opacity="0.12" filter="url(#glow1)"/>

  <!-- Terminal Window Card -->
  <g transform="translate(100, 70)">
    <!-- Window chrome -->
    <rect width="760" height="460" rx="14" fill="#11131a" stroke="#252936" stroke-width="1.5"/>
    <rect width="760" height="44" rx="14" fill="#161822"/>
    <rect y="30" width="760" height="14" fill="#161822"/>
    <line x1="0" y1="44" x2="760" y2="44" stroke="#252936" stroke-width="1"/>
    
    <!-- Window controls -->
    <circle cx="28" cy="22" r="5.5" fill="#ff5f56"/>
    <circle cx="48" cy="22" r="5.5" fill="#ffbd2e"/>
    <circle cx="68" cy="22" r="5.5" fill="#27c93f"/>
    
    <text x="380" y="27" fill="#8890a4" font-family="'Manrope', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">job_scout_agent_pipeline.py — ACTIVE</text>
    <rect x="635" y="13" width="105" height="20" rx="4" fill="#0d2b1f" stroke="#1b6343" stroke-width="1"/>
    <text x="687" y="27" fill="#3dd68c" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STATUS: 94.2% FIT</text>

    <!-- Pipeline Stages -->
    <g transform="translate(30, 70)">
      <rect width="160" height="70" rx="8" fill="#181b26" stroke="#2c3242" stroke-width="1"/>
      <text x="16" y="26" fill="#8d94a5" font-family="monospace" font-size="10">01 / DISCOVERY</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Web & API Ingestion</text>
      
      <rect x="180" width="160" height="70" rx="8" fill="#181b26" stroke="#2c3242" stroke-width="1"/>
      <text x="196" y="26" fill="#8d94a5" font-family="monospace" font-size="10">02 / ANALYSIS</text>
      <text x="196" y="48" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">JD Role Extraction</text>
      
      <rect x="360" width="160" height="70" rx="8" fill="#1c1f2e" stroke="#ff5d65" stroke-width="1.5"/>
      <text x="376" y="26" fill="#ff8f70" font-family="monospace" font-size="10">03 / MATCHING</text>
      <text x="376" y="48" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Vector Scoring</text>

      <rect x="540" width="160" height="70" rx="8" fill="#181b26" stroke="#2c3242" stroke-width="1"/>
      <text x="556" y="26" fill="#8d94a5" font-family="monospace" font-size="10">04 / SYNTHESIS</text>
      <text x="556" y="48" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Daily Intel Brief</text>
    </g>

    <!-- Output Detail Panel -->
    <g transform="translate(30, 165)">
      <rect width="700" height="205" rx="10" fill="#151722" stroke="#242836" stroke-width="1"/>
      
      <text x="25" y="38" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">Job Scout: Autonomous Role Matching</text>
      <text x="25" y="62" fill="#8e96aa" font-family="'Manrope', sans-serif" font-size="13">Multi-agent criteria evaluation with LangChain, FastAPI & vector affinity.</text>

      <!-- Match score badge -->
      <rect x="530" y="22" width="145" height="48" rx="8" fill="#11221c" stroke="#22704b" stroke-width="1"/>
      <text x="602" y="44" fill="#3dd68c" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" text-anchor="middle">94.2%</text>
      <text x="602" y="60" fill="#2eb070" font-family="monospace" font-size="9" text-anchor="middle">SEMANTIC MATCH</text>

      <!-- Stack tags -->
      <g transform="translate(25, 90)">
        <rect width="80" height="26" rx="5" fill="#202433"/>
        <text x="40" y="17" fill="#c3c8d4" font-family="monospace" font-size="11" text-anchor="middle">Python</text>

        <rect x="90" width="100" height="26" rx="5" fill="#202433"/>
        <text x="140" y="17" fill="#c3c8d4" font-family="monospace" font-size="11" text-anchor="middle">LangChain</text>

        <rect x="200" width="80" height="26" rx="5" fill="#202433"/>
        <text x="240" y="17" fill="#c3c8d4" font-family="monospace" font-size="11" text-anchor="middle">FastAPI</text>

        <rect x="290" width="110" height="26" rx="5" fill="#202433"/>
        <text x="345" y="17" fill="#c3c8d4" font-family="monospace" font-size="11" text-anchor="middle">Agentic AI</text>

        <rect x="410" width="110" height="26" rx="5" fill="#202433"/>
        <text x="465" y="17" fill="#c3c8d4" font-family="monospace" font-size="11" text-anchor="middle">Vector DB</text>
      </g>

      <!-- Progress bar -->
      <g transform="translate(25, 145)">
        <text x="0" y="12" fill="#8890a4" font-family="monospace" font-size="11">Profile Alignment Score</text>
        <text x="650" y="12" fill="#ff8f70" font-family="monospace" font-size="11" text-anchor="end">94% (Verified)</text>
        <rect y="22" width="650" height="8" rx="4" fill="#202433"/>
        <rect y="22" width="610" height="8" rx="4" fill="url(#accentG1)"/>
      </g>
    </g>

    <!-- Bottom prompt line -->
    <text x="35" y="435" fill="#ff5d65" font-family="monospace" font-size="12">&gt; agent.execute(criteria="AI Engineer", min_score=0.85) — 12 matches found.</text>
  </g>
</svg>